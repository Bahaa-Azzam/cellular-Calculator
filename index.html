// &#9472;&#9472;&#9472; Mini PDF Generator &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
// Pure JS, no dependencies. Supports: Hebrew text (pre-reversed), 
// colored rectangles, lines, multiple fonts sizes, download as file.
// &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
function MiniPDF() {
  const W = 595, H = 842; // A4 in points
  let objects = [];
  let pageStreams = [];
  let currentStream = [];

  // &#9472;&#9472; Color helpers &#9472;&#9472;
  function hexToRGB(hex) {
    const c = hex.replace('#','');
    return [parseInt(c.slice(0,2),16)/255, parseInt(c.slice(2,4),16)/255, parseInt(c.slice(4,6),16)/255];
  }
  function p3(n) { return n.toFixed(3); }

  // &#9472;&#9472; Stream commands &#9472;&#9472;
  function fillRect(x, y, w, h, hex) {
    const [r,g,b] = hexToRGB(hex);
    currentStream.push(`${p3(r)} ${p3(g)} ${p3(b)} rg`);
    currentStream.push(`${p3(x)} ${p3(y)} ${p3(w)} ${p3(h)} re f`);
  }
  function strokeRect(x, y, w, h, hex, lw) {
    const [r,g,b] = hexToRGB(hex);
    currentStream.push(`${p3(r)} ${p3(g)} ${p3(b)} RG`);
    currentStream.push(`${p3(lw||0.5)} w`);
    currentStream.push(`${p3(x)} ${p3(y)} ${p3(w)} ${p3(h)} re S`);
  }
  function hline(x1, y, x2, hex, lw) {
    const [r,g,b] = hexToRGB(hex);
    currentStream.push(`${p3(r)} ${p3(g)} ${p3(b)} RG`);
    currentStream.push(`${p3(lw||0.3)} w`);
    currentStream.push(`${p3(x1)} ${p3(y)} m ${p3(x2)} ${p3(y)} l S`);
  }

  // &#9472;&#9472; Text: PDF coords are bottom-left, we use top-left convention &#9472;&#9472;
  // font: 0=Helvetica, 1=Helvetica-Bold
  function text(str, x, topY, size, hex, bold) {
    const [r,g,b] = hexToRGB(hex);
    const pdfY = H - topY; // flip Y
    const font = bold ? '/F2' : '/F1';
    // Escape parentheses in string
    const safe = str.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
    currentStream.push(`${p3(r)} ${p3(g)} ${p3(b)} rg`);
    currentStream.push(`BT ${font} ${size} Tf ${p3(x)} ${p3(pdfY)} Td (${safe}) Tj ET`);
  }

  // Right-aligned text (approximate: measure by char count * avg_width)
  function textRight(str, rightX, topY, size, hex, bold) {
    const avgW = size * 0.45; // rough average char width for Helvetica
    const strW = str.length * avgW;
    const x = rightX - strW;
    text(str, Math.max(10, x), topY, size, hex, bold);
  }

  // &#9472;&#9472; Build PDF binary &#9472;&#9472;
  function build() {
    const streamContent = currentStream.join('\n');
    const streamBytes = unescape(encodeURIComponent(streamContent));

    let out = [];
    let offsets = [];

    const w = (s) => out.push(s);
    
    w('%PDF-1.4\n%\xFF\xFF\xFF\xFF\n');
    
    // obj 1: catalog
    offsets[1] = out.join('').length;
    w('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    
    // obj 2: pages
    offsets[2] = out.join('').length;
    w('2 0 obj\n<< /Type /Pages /Kids [3 0 R] /Count 1 >>\nendobj\n');
    
    // obj 3: page
    offsets[3] = out.join('').length;
    w(`3 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}]\n   /Contents 4 0 R\n   /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> >>\nendobj\n`);
    
    // obj 4: content stream
    offsets[4] = out.join('').length;
    w(`4 0 obj\n<< /Length ${streamBytes.length} >>\nstream\n${streamContent}\nendstream\nendobj\n`);
    
    // obj 5: Helvetica
    offsets[5] = out.join('').length;
    w('5 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');
    
    // obj 6: Helvetica-Bold
    offsets[6] = out.join('').length;
    w('6 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n');
    
    // xref
    const xrefOffset = out.join('').length;
    w('xref\n');
    w(`0 7\n`);
    w('0000000000 65535 f \n');
    for (let i = 1; i <= 6; i++) {
      w(String(offsets[i]).padStart(10,'0') + ' 00000 n \n');
    }
    w('trailer\n<< /Size 7 /Root 1 0 R >>\n');
    w(`startxref\n${xrefOffset}\n%%EOF`);
    
    return out.join('');
  }

  return { fillRect, strokeRect, hline, text, textRight, build, W, H };
}

// &#9472;&#9472; Hebrew reverse (for PDF which is LTR only) &#9472;&#9472;
function rv(s) { return String(s).split('').reverse().join(''); }
function fmt(n) { return n.toLocaleString('he-IL',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// &#9472;&#9472; Download PDF &#9472;&#9472;
function downloadPDF(content, filename) {
  var bytes = new Uint8Array(content.length);
  for (var i = 0; i < content.length; i++) {
    bytes[i] = content.charCodeAt(i) & 0xff;
  }
  var binary = '';
  for (var j = 0; j < bytes.length; j++) {
    binary += String.fromCharCode(bytes[j]);
  }
  var b64 = btoa(binary);
  var dataUri = 'data:application/pdf;base64,' + b64;
  var a = document.createElement('a');
  a.href = dataUri;
  a.download = filename || 'document.pdf';
  a.target = '_blank';
  a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){ document.body.removeChild(a); }, 300);
}

    function sec(title, sy) {
      pdf2.fillRect(M, sy, W-M*2, 22, '#1a5fa8');
      pdf2.fillRect(W-M-5, sy, 5, 22, '#f0a500');
      pdf2.textRight(title, RX-8, sy+15, 10, '#ffffff', true);
      return sy+28;
    }
    function row2(label, val, ry, bold) {
      pdf2.textRight(label, RX, ry+10, 9, bold?'#1a1a1a':'#444444', bold);
      pdf2.text('NIS '+_f(val), M, ry+10, 9, '#1a5fa8', bold);
      pdf2.hline(M, ry+14, W-M, '#e0e8f0', 0.3);
      return ry+18;
    }

    // HEADER
    pdf2.fillRect(0, 0, W, 60, '#0d3d7c');
    pdf2.fillRect(0, 0, 8, 60, '#f0a500');
    pdf2.textRight('Cellular Package - Imputed Value & Net Cost', RX-5, 22, 13, '#ffffff', true);
    pdf2.textRight('Package NIS '+_f(res.tp)+' | Tier: '+tierLabel+' | Tax: '+itPct, RX-5, 42, 9, '#a0c0ff', false);
    y=70;

    // SECTION A
    y=sec('Part A - Commercial (vs. Carrier)', y);
    pdf2.textRight('Commercial Deviation Check:', RX, y+10, 9, '#222222', true);
    y+=18;
    y=row2('Package & Equipment Cost', res.tp, y);
    y=row2('Employer Allowance ('+tierLabel+')', tier.v, y);
    pdf2.fillRect(M, y, W-M*2, 20, '#eef4ff');
    pdf2.fillRect(W-M-4, y, 4, 20, '#1a5fa8');
    var devNote = res.cd===0
      ? 'No excess - employer covers full package.'
      : 'Excess: NIS '+_f(res.tp)+' - NIS '+_f(tier.v)+' = NIS '+_f(res.cd);
    pdf2.textRight(devNote, RX-6, y+13, 8.5, '#1a3a6c', false);
    y+=24;
    pdf2.fillRect(M, y, W-M*2, 20, '#ddeeff');
    pdf2.textRight('Employee Share = NIS '+_f(res.cd), RX-6, y+13, 10, '#0d3d7c', true);
    y+=28;

    // SECTION B
    y=sec('Part B - Tax Calculation (ITA)', y);
    pdf2.textRight('Imputed Value Formula:', RX, y+10, 9, '#222222', true);
    y+=18;
    pdf2.textRight('1. Half package: NIS '+_f(res.tp)+' / 2 = NIS '+_f(res.tp/2), RX, y+10, 8.5, '#444444', false);
    y+=16;
    pdf2.textRight('2. Less employee share: NIS '+_f(res.tp/2)+' - NIS '+_f(res.cd)+' = NIS '+_f(res.va), RX, y+10, 8.5, '#444444', false);
    y+=16;
    pdf2.fillRect(M, y, W-M*2, 20, '#ddeeff');
    pdf2.textRight('Imputed Value (Bruto): NIS '+_f(res.va), RX-6, y+13, 10, '#0d3d7c', true);
    y+=28;

    // SECTION C
    y=sec('Part C - Actual Tax Cost', y);
    pdf2.textRight('Tax deductions on NIS '+_f(res.va)+' (combined rate '+totalPct+'):', RX, y+10, 8.5, '#444444', false);
    y+=18;

    // Table header
    pdf2.fillRect(M, y, W-M*2, 20, '#1a5fa8');
    pdf2.textRight('Tax Component', RX-6, y+13, 8.5, '#ffffff', true);
    pdf2.text('Rate', M+80, y+13, 8.5, '#ffffff', true);
    pdf2.text('NIS', M+6, y+13, 8.5, '#ffffff', true);
    y+=20;

    function trow(label, pct, val, ry, tot) {
      if(tot) pdf2.fillRect(M, ry, W-M*2, 20, '#1a5fa8');
      pdf2.textRight(label, RX-6, ry+13, 8.5, tot?'#ffffff':'#333333', tot);
      pdf2.text(pct, M+80, ry+13, 8.5, tot?'#ffffff':'#1a5fa8', tot);
      pdf2.text('NIS '+_f(val), M+6, ry+13, 8.5, tot?'#ffcc44':'#c0392b', tot);
      if(!tot) pdf2.hline(M, ry+16, W-M, '#e0e8f0', 0.3);
      return ry+20;
    }
    y=trow('Income Tax', itPct, res.it, y, false);
    y=trow('Nat. Ins. + Health Tax', '12%', res.nh, y, false);
    y=trow('Total Tax Cost (net deduction)', totalPct, res.tc, y, true);
    y+=8;

    // BOTTOM
    pdf2.fillRect(M, y, W-M*2, 80, '#fff8e0');
    pdf2.strokeRect(M, y, W-M*2, 80, '#f0a500', 1.2);
    pdf2.textRight('Bottom Line - Monthly Net Cost to Employee:', RX-6, y+16, 10, '#7a4a00', true);
    pdf2.textRight('NIS '+_f(res.cd)+'  Commercial Excess (from salary)', RX-6, y+32, 8.5, '#555555', false);
    pdf2.textRight('NIS '+_f(res.tc)+'  Tax Cost (x'+totalPct+')', RX-6, y+46, 8.5, '#555555', false);
    pdf2.fillRect(M+10, y+54, W-M*2-20, 20, '#c0392b');
    pdf2.textRight('Total Net Deduction (Bank)', RX-14, y+67, 10, '#ffffff', true);
    pdf2.text('NIS '+_f(res.nd), M+14, y+67, 10, '#ffffff', true);
    y+=90;

    // FOOTER
    pdf2.hline(M, y, W-M, '#aabbcc', 0.5);
    y+=12;
    pdf2.textRight('Tier: '+tierLabel+' | Employer: NIS '+_f(tier.v)+' | Package: NIS '+_f(_pc)+(_ac>0?' | Acc: NIS '+_f(_ac):'')+' | Tax: '+itPct, RX, y, 7.5, '#aaaaaa', false);
    y+=14;
    pdf2.hline(M, y, W-M, '#aabbcc', 0.5);
    y+=12;
    pdf2.textRight('By Bahaa Azzam  |  Elite Unit - SHAAM', RX, y, 8.5, '#1a5fa8', true);

    var content = pdf2.build();
    downloadPDF(content, 'cellular-analysis.pdf');

  } catch(e) {
    alert('Error: '+e.message);
    console.error(e);
  }
}


const _T=[{l:S_T0,v:88.5},{l:S_T1,v:118},{l:S_T2,v:177},{l:S_T3,v:236}];
// &#1502;&#1491;&#1512;&#1490;&#1497; &#1502;&#1505; &#1492;&#1499;&#1504;&#1505;&#1492; &#1513;&#1493;&#1500;&#1497;&#1497;&#1501; (&#1500;&#1500;&#1488; &#1489;&#1497;&#1496;&#1493;&#1495; &#1500;&#1488;&#1493;&#1502;&#1497; &#1513;&#1504;&#1513;&#1488;&#1512; 12% &#1514;&#1502;&#1497;&#1491;)
const _MR=[{l:S_MR1,it:0.10},{l:S_MR2,it:0.14},{l:S_MR3,it:0.20},{l:S_MR4,it:0.31},{l:S_MR5,it:0.35},{l:S_MR6,it:0.47},{l:S_MR7,it:0.50}];
let _ti=1,_pc=103,_ac=0,_sa=false,_gen=false,_mri=4; // &#1489;&#1512;&#1497;&#1512;&#1514; &#1502;&#1495;&#1491;&#1500;: 35%

function _calc(es,pc,ac,mri){
  const tp=pc+ac,cd=Math.max(0,tp-es),va=Math.max(0,tp/2-cd);
  const itr=_MR[mri].it, nhr=0.12, tcr=itr+nhr;
  const it=va*itr, nh=va*nhr, tc=va*tcr;
  return{tp,cd,va,it,nh,tc,nd:cd+tc,itr,nhr,tcr};
}
function _f(n){return n.toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2});}
function _pct(r){return Math.round(r*100)+'%';}
function _selTier(i){_ti=i;_gen=false;_draw();}
function _selMR(i){_mri=i;_gen=false;_draw();}
function _setPkg(v){_pc=parseFloat(v)||0;_gen=false;}
function _setAcc(v){_ac=parseFloat(v)||0;_gen=false;}
function _togAcc(){_sa=!_sa;_draw();}
function _go(){_gen=true;_draw();}

function _sec(title,content){
  return '<div style="margin-bottom:14px;border:1px solid #d0dce8;border-radius:8px;overflow:hidden;">'
    +'<div style="background:#1a5fa8;color:#fff;padding:7px 12px;font-weight:700;font-size:13px;text-align:right;direction:rtl;border-right:3px solid #f0a500;">'+title+'</div>'
    +'<div style="padding:12px;background:#fff;direction:rtl;text-align:right;">'+content+'</div>'
    +'</div>';
}
function _row(label,value,bold){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f4f8;font-size:13px;direction:rtl;">'
    +'<span style="color:#1a5fa8;font-weight:'+(bold?700:500)+';">&#x20aa; '+_f(value)+'</span>'
    +'<span style="color:'+(bold?'#1a1a1a':'#444')+';font-weight:'+(bold?700:400)+' ;">'+label+'</span>'
    +'</div>';
}
function _rowhi(label,value){
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-size:13px;direction:rtl;background:#1a5fa8;border-radius:4px;margin-top:4px;">'
    +'<span style="color:#ffcc44;font-weight:700;">&#x20aa; '+_f(value)+'</span>'
    +'<span style="color:#fff;font-weight:700;">'+label+'</span>'
    +'</div>';
}

function _draw(){
  const tier=_T[_ti], res=_calc(tier.v,_pc,_ac,_mri);

  // &#1499;&#1508;&#1514;&#1493;&#1512;&#1497; &#1502;&#1491;&#1512;&#1490; &#1502;&#1506;&#1505;&#1497;&#1511;
  document.getElementById('tb').innerHTML=_T.map(function(t,i){
    return '<button onclick="_selTier('+i+')" style="padding:11px 14px;border-radius:9px;'
      +'border:'+(i===_ti?'2.5px solid #1a5fa8':'1.5px solid #d0dce8')+';'
      +'background:'+(i===_ti?'#e8f0fa':'#f8fbff')+';'
      +'color:'+(i===_ti?'#0d3d7c':'#555')+';font-weight:'+(i===_ti?700:400)+';'
      +'font-size:14px;text-align:right;cursor:pointer;display:flex;'
      +'justify-content:space-between;align-items:center;width:100%;font-family:inherit;">'
      +'<span style="color:'+(i===_ti?'#1a5fa8':'#aaa')+';font-weight:700;font-size:13px;">&#x20aa; '+_f(t.v)+'</span>'
      +'<span>'+t.l+'</span></button>';
  }).join('');

  // &#1499;&#1508;&#1514;&#1493;&#1512;&#1497; &#1502;&#1491;&#1512;&#1490; &#1502;&#1505; &#1513;&#1493;&#1500;&#1497;
  document.getElementById('mrb').innerHTML=_MR.map(function(m,i){
    var sel=i===_mri;
    return '<button onclick="_selMR('+i+')" style="padding:8px 10px;border-radius:8px;'
      +'border:'+(sel?'2.5px solid #1a5fa8':'1.5px solid #d0dce8')+';'
      +'background:'+(sel?'#e8f0fa':'#f8fbff')+';'
      +'color:'+(sel?'#0d3d7c':'#555')+';font-weight:'+(sel?700:400)+';'
      +'font-size:13px;cursor:pointer;font-family:inherit;flex:1;min-width:52px;">'
      +_pct(m.it)+'</button>';
  }).join('');

  document.getElementById('pi').value=_pc;
  document.getElementById('ar').style.display=_sa?'block':'none';
  document.getElementById('at').innerHTML=(_sa?'&#9660;':'&#9658;')+' '+S_ACC_BTN;

  var rd=document.getElementById('rd');
  if(!_gen){rd.style.display='none';return;}
  rd.style.display='block';

  var devNote=res.cd===0 ? S_EIN : S_NIK+' &#x20aa;'+_f(res.tp)+' - &#x20aa;'+_f(tier.v)+' = &#x20aa;'+_f(res.cd);
  var totalPct=_pct(res.tcr);
  var itPct=_pct(res.itr);

  rd.innerHTML=
    '<div style="margin-bottom:12px;text-align:right;">'
      +'<div style="font-size:16px;font-weight:800;color:#0d3d7c;">'+S_TITLE+'</div>'
      +'<div style="font-size:12px;color:#888;margin-top:2px;">'+S_CHAVILA+' &#x20aa;'+_f(res.tp)+' | '+tier.l+' | '+S_MASSH2+' '+itPct+'</div>'
      +'<hr style="border-color:#1a5fa8;border-width:2px;border-style:solid;margin:8px 0;">'
    +'</div>'

    +_sec(S_SA,
      _row(S_ALUT,res.tp)
      +_row(S_TAKRA+' ('+tier.l+')',tier.v)
      +'<div style="margin-top:8px;padding:7px 10px;background:#eef4ff;border-radius:6px;border-right:3px solid #1a5fa8;font-size:12.5px;color:#1a3a6c;">'+devNote+'</div>'
      +_row(S_HASH,res.cd,true)
    )

    +_sec(S_SB,
      '<div style="font-size:12.5px;color:#333;line-height:1.75;margin-bottom:6px;">'
        +'<div>&#x2022; '+S_HALF+' &#x20aa;'+_f(res.tp)+' / 2 = <strong>&#x20aa;'+_f(res.tp/2)+'</strong></div>'
        +'<div>&#x2022; '+S_PACH+' &#x20aa;'+_f(res.tp/2)+' - &#x20aa;'+_f(res.cd)+' = <strong>&#x20aa;'+_f(res.va)+'</strong></div>'
      +'</div>'
      +_row(S_ZKI,res.va,true)
    )

    +_sec(S_SC,
      '<div style="border:1px solid #d0dce8;border-radius:6px;overflow:hidden;">'
        +'<div style="display:grid;grid-template-columns:1fr 50px 82px;background:#1a5fa8;color:#fff;font-weight:700;font-size:11px;padding:5px 8px;direction:rtl;">'
          +'<span>'+S_RECHIV+'</span><span style="text-align:center">%</span><span style="text-align:left">(&#x20aa;)</span>'
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 50px 82px;font-size:12.5px;padding:5px 8px;border-top:1px solid #e8eef4;direction:rtl;">'
          +'<span style="color:#333">'+S_MAS1+'</span>'
          +'<span style="text-align:center;color:#1a5fa8;font-weight:600">'+itPct+'</span>'
          +'<span style="text-align:left;color:#c0392b;font-weight:600">&#x20aa;'+_f(res.it)+'</span>'
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 50px 82px;font-size:12.5px;padding:5px 8px;border-top:1px solid #e8eef4;direction:rtl;">'
          +'<span style="color:#333">'+S_MAS2+'</span>'
          +'<span style="text-align:center;color:#1a5fa8;font-weight:600">12%</span>'
          +'<span style="text-align:left;color:#c0392b;font-weight:600">&#x20aa;'+_f(res.nh)+'</span>'
        +'</div>'
        +'<div style="display:grid;grid-template-columns:1fr 50px 82px;font-size:13px;padding:6px 8px;background:#1a5fa8;direction:rtl;">'
          +'<span style="color:#fff;font-weight:700">'+S_MAS3+'</span>'
          +'<span style="text-align:center;color:#fff;font-weight:700">'+totalPct+'</span>'
          +'<span style="text-align:left;color:#ffcc44;font-weight:700">&#x20aa;'+_f(res.tc)+'</span>'
        +'</div>'
      +'</div>'
    )

    +'<div style="background:linear-gradient(135deg,#fff8e0,#fffdf0);border:2px solid #f0a500;border-radius:10px;padding:14px;margin-bottom:14px;">'
      +'<div style="font-weight:800;font-size:13px;color:#7a4a00;margin-bottom:10px;">'+S_SHURA+'</div>'
      +_row(S_HARUGA,res.cd)
      +_row(S_ALMAS+' (&#x20aa;'+_f(res.va)+' &times; '+totalPct+')',res.tc)
      +_rowhi(S_SACH,res.nd)
    +'</div>'

    +'<button onclick="_pdf()" style="width:100%;padding:13px;background:linear-gradient(135deg,#1a7a3c,#27ae60);'
      +'color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;'
      +'cursor:pointer;box-shadow:0 4px 12px rgba(39,174,96,0.25);margin-bottom:8px;'
      +'font-family:inherit;direction:rtl;">'+S_HORAD+'</button>';
}

window.onload=function(){_draw();};

</script>
