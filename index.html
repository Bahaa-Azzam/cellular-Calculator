<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a5fa8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="סלולרית">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>ניתוח חבילה סלולרית</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;direction:rtl;background:linear-gradient(135deg,#e8f0fa 0%,#f5f8ff 100%);min-height:100vh;min-height:100dvh;}
input[type=number]{-moz-appearance:textfield;}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
button,input{font-family:'Segoe UI','Arial Hebrew',Arial,sans-serif;}
.inp{width:100%;padding:10px 12px;border:1.5px solid #c8d8e8;border-radius:8px;font-size:16px;text-align:right;direction:rtl;background:#f8fbff;outline:none;color:#222;}
.inp:focus{border-color:#1a5fa8;background:#fff;}
#credit{text-align:center;padding:14px 0 24px;font-size:12px;color:#8899aa;direction:ltr;letter-spacing:0.3px;}
#credit strong{color:#1a5fa8;font-weight:700;}
</style>
</head>
<body>

<!-- HEADER -->
<div style="background:linear-gradient(135deg,#0d3d7c 0%,#1a5fa8 100%);color:#fff;padding:20px 20px 16px;text-align:right;box-shadow:0 4px 20px rgba(0,0,0,0.18);">
  <div style="font-size:11px;opacity:0.65;margin-bottom:3px;letter-spacing:1px;">מחשבון</div>
  <div style="font-size:20px;font-weight:800;line-height:1.3;">ניתוח עלות חבילה סלולרית</div>
  <div style="font-size:13px;opacity:0.8;margin-top:3px;">זקיפת שווי ועלות נטו לעובד</div>
</div>

<!-- INPUT CARD -->
<div style="margin:16px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 16px rgba(26,95,168,0.1);">
  <label style="display:block;font-size:13px;font-weight:600;color:#1a5fa8;margin-bottom:8px;">מדרג השתתפות מעסיק</label>
  <div id="tb" style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;"></div>

  <label style="display:block;font-size:13px;font-weight:600;color:#1a5fa8;margin-bottom:5px;">עלות חבילה סלולרית (₪)</label>
  <input id="pi" type="number" class="inp" min="0" step="0.1" style="margin-bottom:14px;" oninput="_setPkg(this.value)">

  <button id="at" onclick="_togAcc()" style="background:none;border:none;color:#1a5fa8;font-size:13px;font-weight:600;cursor:pointer;padding:0;display:flex;align-items:center;gap:4px;margin-bottom:14px;">▸ הוסף עלות אביזרים</button>
  <div id="ar" style="display:none;margin-bottom:14px;">
    <label style="display:block;font-size:13px;font-weight:600;color:#1a5fa8;margin-bottom:5px;">עלות אביזרים (₪)</label>
    <input id="ai" type="number" class="inp" min="0" step="0.1" value="0" oninput="_setAcc(this.value)">
  </div>

  <button onclick="_go()" style="width:100%;padding:13px;background:linear-gradient(135deg,#0d3d7c,#1a5fa8);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(26,95,168,0.3);">חשב ↓</button>
</div>

<!-- RESULTS -->
<div id="rd" style="display:none;margin:0 16px 16px;"></div>

<!-- CREDIT -->
<div id="credit">
  <strong>By Bahaa Azzam</strong> &nbsp;|&nbsp; יחידת העילית – שע"מ
</div>

<!-- PWA install hint for iOS -->
<div id="ios-hint" style="display:none;margin:0 16px 16px;padding:10px 14px;background:#fff8e0;border:1px solid #f0a500;border-radius:8px;font-size:12px;color:#7a4a00;text-align:right;line-height:1.7;">
  📲 <strong>להתקנה על iPhone:</strong> לחץ על 🔗 (Share) ← "הוסף למסך הבית" ← "הוסף"
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="src/app.obf.js"></script>
<script>
// Register Service Worker
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(r => console.log('SW registered'))
      .catch(e => console.log('SW failed', e));
  });
}

// Show iOS install hint if on Safari iOS and not already installed
(function(){
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua);
  const isSafari = /safari/i.test(ua) && !/chrome|crios/i.test(ua);
  const isStandalone = ('standalone' in navigator) && navigator.standalone;
  if(isIOS && isSafari && !isStandalone){
    document.getElementById('ios-hint').style.display = 'block';
  }
})();
</script>
</body>
</html>
